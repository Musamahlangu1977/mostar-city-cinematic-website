name: Import deployed Mostar site
on:
  push:
    paths:
      - README.md
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.repository == 'Musamahlangu1977/mostar-city-cinematic-website'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Get site source and local assets from the deployed website
        run: python scripts/import_live_site.py
      - name: Commit website source and media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css script.js gallery.css gallery.js assets/
          if ! git diff --staged --quiet; then
            git commit -m "feat: import Mostar cinematic website source and media"
            git push
          fi
